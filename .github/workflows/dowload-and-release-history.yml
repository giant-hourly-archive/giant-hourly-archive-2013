name: Download and release historical archives

on:
  workflow_dispatch:
  push:
    tags:
      # must be in the 2026-05-01 format
      - "*-*-*"

jobs:
  fetch-and-release:
    permissions:
      contents: write

    name: Fetch and release gharchive data
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: 3.14

      - name: Install requirements
        run: python -m pip install --upgrade -r requirements.txt

      - name: Fetch data files for today, store in dist/
        run: python fetch.py ${{ github.ref_name }} dist/

      - name: Create GH release with data files
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda
        if: github.ref_type == 'tag'
        with:
          files: dist/*
          overwrite_files: true
          # preserve_order uploads file sequentially (thanks to @mrpollo )
          preserve_order: true
